name = "profile-views"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "STATS"
class_name = "ProfileStats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Stats", to = "ProfileStats" }]

[vars]
GITHUB_USERNAME = "noahotim"
GITHUB_PROFILE_URL = "https://github.com/noahotim"

# DASHBOARD_KEY is a secret, not a var. Set it with:
#   npx wrangler secret put DASHBOARD_KEY
# This key is what keeps the country breakdown private to you.
